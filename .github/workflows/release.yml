name: Build (Windows .exe)

# Gera os executáveis do Windows (Renemya.exe e renemya-cli.exe).
# - Push na main (ou execução manual em Actions > Run workflow): os .exe ficam só como
#   artefatos da execução (aba Actions). Nenhuma tag ou Release é criada.
# - Tag "v*" criada por você (ex.: git tag v2.0.0 && git push origin v2.0.0): além dos
#   artefatos, anexa os .exe ao Release dessa tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev,build]"
      - name: Testes antes de empacotar
        run: pytest -q
      - name: PyInstaller (interface)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Renemya
          --icon renemya/gui/assets/renemya_icon.ico
          --paths .
          --collect-data renemya
          packaging/gui_launcher.py
      - name: PyInstaller (linha de comando)
        run: >
          pyinstaller --noconfirm --onefile --console
          --name renemya-cli
          --icon renemya/gui/assets/renemya_icon.ico
          --paths .
          --collect-data renemya
          packaging/cli_launcher.py
      - name: Teste rápido do executável de linha de comando
        run: dist/renemya-cli.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: Renemya-windows
          path: dist/*.exe
      - name: Publica no Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
